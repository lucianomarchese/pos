name: Verify and deploy POS demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-demo-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Check public files
        run: test -f dist/index.html && test -f dist/styles.css && test -f dist/src/app.js

  deploy:
    # La llave DEPLOY_KEY está atada en core a `ci-deploy --scope athaleo` (BWS CI_DEPLOY_KEY_ATHALEO):
    # solo acepta el nombre del sitio. Core actualiza su checkout a main, prueba, construye y publica.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Connect to Athaleo VPS
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy on core
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p 2288 -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" pos
      - name: Verify deployed site
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --output /dev/null https://pos.athaleo.dev
