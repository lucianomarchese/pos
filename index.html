<!doctype html>
<html lang="es" data-mode="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8efe0" />
    <title>Kesar · POS Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 60V30C6 15 18 4 32 4s26 11 26 26v30z' fill='%23c8341c'/%3E%3Cpath d='M32 22c-7 8-7 18 0 26 7-8 7-18 0-26z' fill='%23f2b632'/%3E%3C/svg%3E" />
    <script>
      // Fija el modo antes de pintar para evitar un destello del modo equivocado.
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('pos-kesar-mode'); } catch (error) { mode = null; }
        if (mode !== 'day' && mode !== 'night') mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        document.documentElement.dataset.mode = mode;
        if (mode === 'night') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1f24');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
